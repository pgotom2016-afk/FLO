<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#111827">
  <title>Auto Pan Tremolo</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #111827;
      --panel: #1f2937;
      --panel-2: #374151;
      --text: #f9fafb;
      --muted: #9ca3af;
      --accent: #60a5fa;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      padding:
        calc(20px + env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        calc(28px + env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));

      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   sans-serif;
      -webkit-text-size-adjust: 100%;
    }

    main {
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
    }

    h1 {
      margin: 8px 0 24px;
      font-size: clamp(28px, 8vw, 42px);
      line-height: 1.1;
    }

    .panel {
      padding: 18px;
      border-radius: 18px;
      background: var(--panel);
      box-shadow: 0 8px 28px rgba(0, 0, 0, .22);
    }

    .file-button,
    button {
      min-height: 48px;
      border: 0;
      border-radius: 12px;
      padding: 12px 16px;
      font: inherit;
      font-weight: 600;
      color: var(--text);
      background: var(--panel-2);
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .file-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      background: var(--accent);
      color: #07111f;
      text-align: center;
    }

    #file {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .control {
      margin-top: 22px;
    }

    label.control-label {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      font-size: 15px;
      font-weight: 600;
    }

    output {
      color: var(--accent);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      width: 100%;
      height: 44px;
      margin: 0;
      background: transparent;
      accent-color: var(--accent);
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 6px;
      border-radius: 999px;
      background: #4b5563;
    }

    input[type="range"]::-webkit-slider-thumb {
      width: 26px;
      height: 26px;
      margin-top: -10px;
      border: 0;
      border-radius: 50%;
      background: var(--accent);
      -webkit-appearance: none;
    }

    select {
      width: 100%;
      min-height: 48px;
      border: 0;
      border-radius: 12px;
      padding: 0 12px;
      font: inherit;
      color: var(--text);
      background: var(--panel-2);
    }

    .hint {
      margin: 16px 2px 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }
  </style>
</head>

<body>
  <main>
    <h1>Auto Pan Tremolo</h1>

    <section class="panel">
      <label class="file-button" for="file">
        Choose audio file
      </label>
      <input id="file" type="file" accept="audio/*">

      <div class="buttons">
        <button id="play" disabled>Play</button>
        <button id="stop" disabled>Stop</button>
        <button id="bypass" disabled>Bypass</button>
      </div>

      <div class="control">
        <label class="control-label" for="rate">
          <span>Rate</span>
          <output id="rateOut">1 Hz</output>
        </label>
        <input id="rate" type="range"
               min=".05" max="20" value="1" step=".01">
      </div>

      <div class="control">
        <label class="control-label" for="amount">
          <span>Amount</span>
          <output id="amountOut">100%</output>
        </label>
        <input id="amount" type="range"
               min="0" max="1" value="1" step=".001">
      </div>

      <div class="control">
        <label class="control-label" for="phase">
          <span>Stereo phase</span>
          <output id="phaseOut">180°</output>
        </label>
        <input id="phase" type="range"
               min="0" max="360" value="180">
      </div>

      <div class="control">
        <label class="control-label" for="wave">
          <span>Waveform</span>
        </label>
        <select id="wave">
          <option value="sine">Sine</option>
          <option value="triangle">Triangle</option>
          <option value="square">Square</option>
          <option value="ramp">Ramp</option>
        </select>
      </div>

      <div class="control">
        <label class="control-label" for="mix">
          <span>Dry/Wet</span>
          <output id="mixOut">100%</output>
        </label>
        <input id="mix" type="range"
               min="0" max="1" value="1" step=".001">
      </div>

      <p class="hint">
        Choose an audio file, then tap Play. Keep the page open while testing.
      </p>
    </section>
  </main>

  <!-- Keep your existing JavaScript from the previous index.html here. -->
  <script>
    /* Paste the existing setup/playback script here. */
  </script>
</body>
</html>
